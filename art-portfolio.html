<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>art portfolio</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>


    <script defer type='module' src="js/app.js"></script>
    <script defer type ='module' src="js/art.js"></script>




    <!--set favicon-->
    <link rel="shortcut icon" type="image/png" href="images/dog.png">
</head>
<body class="alt-page">
        <div class="wave"></div>

    <div class="content">
        <div class="background-container">
                <div id="navbar"></div>
                <img src="images/star.svg" class="scroll-widget">

                <div id="art-gallery-container">
                        <h2 class="page-heading">my artwork</h2>
                </div>

                <div class="page-description">
                    <p>check out more of my art on instagram <a href="https://www.instagram.com/shrkshkk/" 
                                target="_blank" 
                                id="link">@shrkshkk</a>! and pro-tip: try clicking the artwork to see more details!</p>
                </div>

                    <img src="images/shrkshkk.png" alt="Logo" class="logo">

                <div class="tag-buttons">
                    <button data-tag="digital">digital</button>
                    <button data-tag="traditional">traditional</button>
                    <button data-tag="all">all</button>
                </div>

                <div class="art-gallery"></div>

            </div>
    </div>
    
</body>
</html>
